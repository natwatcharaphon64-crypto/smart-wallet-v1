<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Wallet - บันทึกรายรับรายจ่าย</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Kanit', sans-serif, system-ui;
            padding-bottom: 70px;
        }
        .wallet-card {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            color: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.2);
        }
        .btn-action {
            border-radius: 12px;
            padding: 12px;
            font-weight: 500;
        }
        .tx-item {
            background: white;
            border-radius: 14px;
            padding: 14px 18px;
            margin-bottom: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .tx-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background-color: #f3f4f6;
            margin-right: 12px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }
        .nav-item-btn {
            text-align: center;
            color: #888;
            text-decoration: none;
            font-size: 0.85rem;
            background: none;
            border: none;
            cursor: pointer;
            width: 50%;
        }
        .nav-item-btn.active {
            color: #6366f1;
            font-weight: bold;
        }
        .slip-preview-box {
            max-height: 250px;
            overflow: hidden;
            border-radius: 12px;
            border: 2px dashed #6366f1;
            background: #f8fafc;
        }
        .slip-preview-box img {
            width: 100%;
            object-fit: contain;
            max-height: 240px;
        }
    </style>
</head>
<body>

<div class="container py-3" style="max-width: 500px;">
    
    <!-- Input ซ่อนไว้สำหรับแนบไฟล์รูปภาพสลิป -->
    <input type="file" id="slip-file-input" accept="image/*" class="d-none" onchange="handleSlipUpload(event)">

    <!-- ================= VIEW 1: หน้าหลัก ================= -->
    <div id="main-view">
        <!-- Header Card -->
        <div class="wallet-card mb-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <span class="fw-bold"><i class="fa-solid fa-wallet me-2"></i>Smart Wallet</span>
                <span class="badge bg-light text-dark rounded-pill px-3 py-2" id="current-month-badge">สิงหาคม 2569</span>
            </div>
            <div class="text-center my-3">
                <div class="small opacity-75">ยอดเงินคงเหลือสุทธิ</div>
                <h2 class="display-6 fw-bold mb-0" id="total-balance">฿0.00</h2>
            </div>
            <div class="row text-center mt-4 pt-3 border-top border-white-50">
                <div class="col-6 border-end border-white-50">
                    <div class="small opacity-75">รายรับเดือนนี้</div>
                    <div class="fw-bold text-warning" id="month-income">+฿0.00</div>
                </div>
                <div class="col-6">
                    <div class="small opacity-75">รายจ่ายเดือนนี้</div>
                    <div class="fw-bold text-danger" id="month-expense">-฿0.00</div>
                </div>
            </div>
        </div>

        <!-- Quick Action Buttons -->
        <div class="row g-2 mb-4">
            <div class="col-6">
                <button class="btn btn-light btn-action w-100 shadow-sm text-start" onclick="openAddModal()">
                    <i class="fa-solid fa-plus text-primary me-2"></i><strong>เพิ่มรายการ</strong>
                </button>
            </div>
            <div class="col-6">
                <button class="btn btn-light btn-action w-100 shadow-sm text-start" onclick="triggerSlipUpload()">
                    <i class="fa-solid fa-image text-success me-2"></i><strong>นำเข้ารูป / สลิป</strong>
                </button>
            </div>
        </div>

        <!-- Recent Transactions Header -->
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="fw-bold mb-0">ประวัติรายการล่าสุด</h6>
            <small class="text-muted">(แตะเพื่อแก้ไข)</small>
        </div>

        <!-- Transaction List -->
        <div id="tx-list"></div>
    </div>

    <!-- ================= VIEW 2: สรุปรายเดือน ================= -->
    <div id="summary-view" class="d-none">
        <h5 class="fw-bold mb-3"><i class="fa-solid fa-chart-pie me-2 text-primary"></i>สรุปภาพรวมรายเดือน</h5>
        
        <!-- ตัวเลือกเดือน -->
        <div class="card border-0 shadow-sm p-3 mb-3" style="border-radius: 16px;">
            <label class="form-label small fw-bold text-muted mb-1">เลือกเดือนที่ต้องการดูสรุป</label>
            <input type="month" id="summary-month-picker" class="form-control" onchange="renderSummary()">
        </div>

        <!-- การ์ดสรุปยอดเงินประจำเดือน -->
        <div class="row g-2 mb-3">
            <div class="col-6">
                <div class="bg-success-subtle text-success p-3 rounded-4">
                    <div class="small fw-bold opacity-75">รายรับรวม</div>
                    <div class="h5 fw-bold mb-0" id="sum-income">+฿0.00</div>
                </div>
            </div>
            <div class="col-6">
                <div class="bg-danger-subtle text-danger p-3 rounded-4">
                    <div class="small fw-bold opacity-75">รายจ่ายรวม</div>
                    <div class="h5 fw-bold mb-0" id="sum-expense">-฿0.00</div>
                </div>
            </div>
        </div>

        <!-- รายละเอียดแยกตามหมวดหมู่ -->
        <div class="card border-0 shadow-sm p-3 mb-3" style="border-radius: 16px;">
            <h6 class="fw-bold mb-3">สัดส่วนรายจ่ายแยกตามหมวดหมู่</h6>
            <div id="summary-category-list"></div>
        </div>
    </div>

</div>

<!-- Modal สำหรับ เพิ่ม / แก้ไข รายการ -->
<div class="modal fade" id="txModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="modalTitle">เพิ่มรายการใหม่</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- กล่องแสดงตัวอย่างรูปสลิป -->
                <div id="slip-preview-container" class="mb-3 d-none">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <small class="fw-bold text-primary"><i class="fa-solid fa-file-invoice me-1"></i>รูปสลิปแนบ</small>
                        <button type="button" class="btn-close btn-sm" onclick="clearSlipPreview()"></button>
                    </div>
                    <div class="slip-preview-box text-center p-1">
                        <img id="slip-preview-img" src="" alt="Slip Preview">
                    </div>
                </div>

                <form id="txForm" onsubmit="handleFormSubmit(event)">
                    <input type="hidden" id="tx-id">

                    <!-- ประเภท รายจ่าย/รายรับ -->
                    <div class="btn-group w-100 mb-3" role="group">
                        <input type="radio" class="btn-check" name="type-select" id="type-expense" value="expense" checked onchange="updateCategoryOptions()">
                        <label class="btn btn-outline-danger" for="type-expense"><i class="fa-solid fa-minus me-1"></i>รายจ่าย</label>

                        <input type="radio" class="btn-check" name="type-select" id="type-income" value="income" onchange="updateCategoryOptions()">
                        <label class="btn btn-outline-success" for="type-income"><i class="fa-solid fa-plus me-1"></i>รายรับ</label>
                    </div>

                    <!-- ช่องเลือกวันที่บันทึก -->
                    <div class="mb-3">
                        <label for="tx-date" class="form-label fw-bold">วันที่บันทึก</label>
                        <input type="date" id="tx-date" class="form-control" required>
                    </div>

                    <!-- เลือกหมวดหมู่ -->
                    <div class="mb-3">
                        <label for="tx-cat" class="form-label fw-bold">หมวดหมู่</label>
                        <select id="tx-cat" class="form-select" required></select>
                    </div>

                    <!-- รายละเอียด / ชื่อรายการ -->
                    <div class="mb-3">
                        <label for="tx-desc" class="form-label fw-bold">รายการ / คำอธิบาย</label>
                        <input type="text" id="tx-desc" class="form-control" placeholder="เช่น สแกนจากสลิป, ก๋วยเตี๋ยว" required>
                    </div>

                    <!-- จำนวนเงิน -->
                    <div class="mb-3">
                        <label for="tx-amount" class="form-label fw-bold">จำนวนเงิน (บาท)</label>
                        <input type="number" step="0.01" id="tx-amount" class="form-control" placeholder="0.00" required>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4">
                        <button type="button" id="btn-delete" class="btn btn-outline-danger d-none" onclick="confirmDelete()">
                            <i class="fa-solid fa-trash me-1"></i>ลบรายการ
                        </button>
                        <div class="ms-auto">
                            <button type="button" class="btn btn-light me-2" data-bs-dismiss="modal">ยกเลิก</button>
                            <button type="submit" class="btn btn-primary px-4">บันทึก</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bottom Navigation Bar -->
<div class="bottom-nav">
    <button type="button" class="nav-item-btn active" id="nav-home" onclick="switchTab('home')">
        <i class="fa-solid fa-house d-block mb-1"></i>หน้าหลัก
    </button>
    <button type="button" class="nav-item-btn" id="nav-summary" onclick="switchTab('summary')">
        <i class="fa-solid fa-chart-pie d-block mb-1"></i>สรุปรายเดือน
    </button>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // 🔗 URL ของ Google Apps Script
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxLma3r_07TUwPC9pGD2ec55651Q9yDbxfDFWCIyeXluUmH5FtANFoLwHyu-G06tT/exec';

    const categories = {
        expense: [
            { id: 'food', name: 'อาหาร & เครื่องดื่ม', icon: '🍔' },
            { id: 'transport', name: 'เดินทาง & น้ำมัน', icon: '🚗' },
            { id: 'shopping', name: 'ช้อปปิ้ง', icon: '🛍️' },
            { id: 'bills', name: 'บิล & ค่าน้ำค่าไฟ', icon: '💡' },
            { id: 'house', name: 'ที่อยู่อาศัย', icon: '🏠' },
            { id: 'other_exp', name: 'อื่นๆ', icon: '📦' }
        ],
        income: [
            { id: 'salary', name: 'เงินเดือน & โบนัส', icon: '💼' },
            { id: 'freelance', name: 'รับจ้าง & งานนอก', icon: '💻' },
            { id: 'investment', name: 'ปันผล & การลงทุน', icon: '📈' },
            { id: 'other_inc', name: 'รายรับอื่นๆ', icon: '💰' }
        ]
    };

    let transactions = JSON.parse(localStorage.getItem('smart_wallet_tx')) || [];
    let modalInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
        modalInstance = new bootstrap.Modal(document.getElementById('txModal'));
        renderApp();
    });

    // -------------------------------------------------------------
    // ฟังก์ชันนำเข้าและอ่านรูปสลิป (Slip Reader)
    // -------------------------------------------------------------
    function triggerSlipUpload() {
        document.getElementById('slip-file-input').click();
    }

    function handleSlipUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            // แสดงรูปตัวอย่างสลิปใน Modal
            document.getElementById('slip-preview-img').src = e.target.result;
            document.getElementById('slip-preview-container').classList.remove('d-none');

            // เตรียมแบบฟอร์มบันทึก
            openAddModal();
            document.getElementById('modalTitle').textContent = 'บันทึกจากรูปสลิป';
            document.getElementById('tx-desc').value = 'สแกนจากสลิป/รูปถ่าย';
            
            // โฟกัสไปที่ช่องจำนวนเงินทันทีเพื่อให้พิมพ์ได้สะดวกขณะดูรูป
            setTimeout(() => {
                document.getElementById('tx-amount').focus();
            }, 500);
        };
        reader.readAsDataURL(file);
        event.target.value = ''; // รีเซ็ต input file
    }

    function clearSlipPreview() {
        document.getElementById('slip-preview-container').classList.add('d-none');
        document.getElementById('slip-preview-img').src = '';
    }

    // -------------------------------------------------------------
    // ฟังก์ชันสลับหน้า แท็บเมนู (Tab Switching)
    // -------------------------------------------------------------
    function switchTab(tab) {
        const mainView = document.getElementById('main-view');
        const summaryView = document.getElementById('summary-view');
        const navHome = document.getElementById('nav-home');
        const navSummary = document.getElementById('nav-summary');

        if (tab === 'home') {
            mainView.classList.remove('d-none');
            summaryView.classList.add('d-none');
            navHome.classList.add('active');
            navSummary.classList.remove('active');
        } else if (tab === 'summary') {
            mainView.classList.add('d-none');
            summaryView.classList.remove('d-none');
            navHome.classList.remove('active');
            navSummary.classList.add('active');

            const picker = document.getElementById('summary-month-picker');
            if (!picker.value) {
                picker.value = new Date().toISOString().slice(0, 7);
            }
            renderSummary();
        }
    }

    // -------------------------------------------------------------
    // ฟังก์ชันประมวลผลสรุปรายเดือน
    // -------------------------------------------------------------
    function renderSummary() {
        const selectedMonth = document.getElementById('summary-month-picker').value;
        const catListEl = document.getElementById('summary-category-list');
        catListEl.innerHTML = '';

        if (!selectedMonth) return;

        let totalInc = 0;
        let totalExp = 0;
        const expTotals = {};

        const monthTx = transactions.filter(t => t.date && t.date.startsWith(selectedMonth));

        monthTx.forEach(tx => {
            const amt = Number(tx.amount);
            if (tx.type === 'expense') {
                totalExp += amt;
                expTotals[tx.cat] = (expTotals[tx.cat] || 0) + amt;
            } else {
                totalInc += amt;
            }
        });

        document.getElementById('sum-income').textContent = `+฿${totalInc.toLocaleString('th-TH', { minimumFractionDigits: 2 })}`;
        document.getElementById('sum-expense').textContent = `-฿${totalExp.toLocaleString('th-TH', { minimumFractionDigits: 2 })}`;

        if (totalExp === 0) {
            catListEl.innerHTML = `<div class="text-center text-muted py-3">ไม่มีรายการรายจ่ายในเดือนนี้</div>`;
            return;
        }

        Object.keys(expTotals).forEach(catId => {
            const catAmt = expTotals[catId];
            const percent = ((catAmt / totalExp) * 100).toFixed(1);
            const catObj = categories.expense.find(c => c.id === catId) || { icon: '📦', name: catId };

            const html = `
                <div class="mb-3">
                    <div class="d-flex justify-content-between mb-1">
                        <span class="small fw-bold">${catObj.icon} ${catObj.name}</span>
                        <span class="small fw-bold">฿${catAmt.toLocaleString('th-TH', { minimumFractionDigits: 2 })} (${percent}%)</span>
                    </div>
                    <div class="progress" style="height: 8px;">
                        <div class="progress-bar bg-danger" role="progressbar" style="width: ${percent}%"></div>
                    </div>
                </div>
            `;
            catListEl.insertAdjacentHTML('beforeend', html);
        });
    }

    // -------------------------------------------------------------
    // ฟังก์ชันส่งข้อมูลไปยัง Google Sheet
    // -------------------------------------------------------------
    function syncToGoogleSheet(txData, action = 'create') {
        if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.trim() === '') return;

        const payload = {
            action: action,
            id: txData.id,
            date: txData.date,
            type: txData.type,
            cat: txData.cat,
            catName: getCategoryName(txData.type, txData.cat),
            desc: txData.desc,
            amount: txData.amount
        };

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
        }).then(() => {
            console.log(`Synced (${action}) to Google Sheet successfully`);
        }).catch(err => {
            console.error('Error syncing to Google Sheet:', err);
        });
    }

    function getCategoryName(type, catId) {
        const list = categories[type] || [];
        const found = list.find(c => c.id === catId);
        return found ? `${found.icon} ${found.name}` : catId;
    }

    function updateCategoryOptions() {
        const selectedType = document.querySelector('input[name="type-select"]:checked').value;
        const catSelect = document.getElementById('tx-cat');
        catSelect.innerHTML = '';
        
        categories[selectedType].forEach(cat => {
            const opt = document.createElement('option');
            opt.value = cat.id;
            opt.textContent = `${cat.icon} ${cat.name}`;
            catSelect.appendChild(opt);
        });
    }

    function openAddModal() {
        document.getElementById('modalTitle').textContent = 'เพิ่มรายการใหม่';
        document.getElementById('txForm').reset();
        document.getElementById('tx-id').value = '';
        document.getElementById('type-expense').checked = true;
        document.getElementById('tx-date').value = new Date().toISOString().split('T')[0];
        
        updateCategoryOptions();
        document.getElementById('btn-delete').classList.add('d-none');
        modalInstance.show();
    }

    function editTransaction(id) {
        clearSlipPreview();
        const tx = transactions.find(t => t.id === id);
        if (!tx) return;

        document.getElementById('modalTitle').textContent = 'แก้ไขรายการ';
        document.getElementById('tx-id').value = tx.id;
        document.getElementById(`type-${tx.type}`).checked = true;
        
        updateCategoryOptions();
        
        document.getElementById('tx-date').value = tx.date;
        document.getElementById('tx-cat').value = tx.cat;
        document.getElementById('tx-desc').value = tx.desc;
        document.getElementById('tx-amount').value = tx.amount;

        document.getElementById('btn-delete').classList.remove('d-none');
        modalInstance.show();
    }

    function handleFormSubmit(event) {
        event.preventDefault();
        
        const txId = document.getElementById('tx-id').value;
        const type = document.querySelector('input[name="type-select"]:checked').value;
        const selectedDate = document.getElementById('tx-date').value || new Date().toISOString().split('T')[0];
        
        const txData = {
            id: txId || Date.now().toString(),
            date: selectedDate,
            type: type,
            cat: document.getElementById('tx-cat').value,
            desc: document.getElementById('tx-desc').value.trim(),
            amount: parseFloat(document.getElementById('tx-amount').value)
        };

        if (txId) {
            const index = transactions.findIndex(t => t.id === txId);
            if (index !== -1) transactions[index] = txData;
            syncToGoogleSheet(txData, 'update');
        } else {
            transactions.unshift(txData);
            syncToGoogleSheet(txData, 'create');
        }

        clearSlipPreview();
        saveAndRender();
        modalInstance.hide();
    }

    function confirmDelete() {
        const txId = document.getElementById('tx-id').value;
        if (!txId) return;

        if (confirm('คุณต้องการลบรายการนี้ใช่หรือไม่?')) {
            const txData = transactions.find(t => t.id === txId);
            transactions = transactions.filter(t => t.id !== txId);
            
            if (txData) syncToGoogleSheet(txData, 'delete');
            
            clearSlipPreview();
            saveAndRender();
            modalInstance.hide();
        }
    }

    function saveAndRender() {
        localStorage.setItem('smart_wallet_tx', JSON.stringify(transactions));
        renderApp();
        if (!document.getElementById('summary-view').classList.contains('d-none')) {
            renderSummary();
        }
    }

    function renderApp() {
        const listEl = document.getElementById('tx-list');
        listEl.innerHTML = '';

        let totalBalance = 0;
        let monthIncome = 0;
        let monthExpense = 0;

        const now = new Date();
        const currentYearMonth = now.toISOString().slice(0, 7);

        transactions.forEach(tx => {
            const isExpense = tx.type === 'expense';
            const amount = Number(tx.amount);

            if (isExpense) {
                totalBalance -= amount;
            } else {
                totalBalance += amount;
            }

            if (tx.date && tx.date.startsWith(currentYearMonth)) {
                if (isExpense) monthExpense += amount;
                else monthIncome += amount;
            }

            const catObj = (categories[tx.type] || []).find(c => c.id === tx.cat) || { icon: '📝', name: tx.cat };
            const itemHtml = `
                <div class="tx-item" onclick="editTransaction('${tx.id}')">
                    <div class="d-flex align-items-center">
                        <div class="tx-icon">${catObj.icon}</div>
                        <div>
                            <div class="fw-bold text-dark">${tx.desc}</div>
                            <small class="text-muted">${tx.date} • ${catObj.name}</small>
                        </div>
                    </div>
                    <div class="text-end">
                        <div class="fw-bold ${isExpense ? 'text-danger' : 'text-success'}">
                            ${isExpense ? '-' : '+'}฿${amount.toLocaleString('th-TH', { minimumFractionDigits: 2 })}
                        </div>
                        <i class="fa-solid fa-pen text-muted small ms-1"></i>
                    </div>
                </div>
            `;
            listEl.insertAdjacentHTML('beforeend', itemHtml);
        });

        if (transactions.length === 0) {
            listEl.innerHTML = `<div class="text-center text-muted py-4">ยังไม่มีรายการบันทึก</div>`;
        }

        document.getElementById('total-balance').textContent = `฿${totalBalance.toLocaleString('th-TH', { minimumFractionDigits: 2 })}`;
        document.getElementById('month-income').textContent = `+฿${monthIncome.toLocaleString('th-TH', { minimumFractionDigits: 2 })}`;
        document.getElementById('month-expense').textContent = `-฿${monthExpense.toLocaleString('th-TH', { minimumFractionDigits: 2 })}`;
    }
</script>
</body>
</html>
